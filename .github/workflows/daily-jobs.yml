name: Daily Dubai job digest

on:
  schedule:
    # 01:30 UTC = 05:30 Dubai time, Monday to Friday.
    # GitHub can run late by 5-30 min, so this still lands before 6:00.
    - cron: "30 1 * * 1-5"
  workflow_dispatch:   # lets you press "Run workflow" to test

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Find jobs and email me
        run: python job_digest.py
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
      - name: Save history (seen jobs + CSV log)
        run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add seen_jobs.json jobs_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update job history" && git push)
